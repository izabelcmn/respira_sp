services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8501:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - MODEL_TARGET=local
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - MODEL_TARGET=local
      - RESPIRA_API_URL=http://api:8080
    depends_on:
      - api
    restart: unless-stopped
