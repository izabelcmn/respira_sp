services:
  respira_sp:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - MODEL_TARGET=local
      - RESPIRA_API_URL=http://localhost:8000
    restart: unless-stopped
